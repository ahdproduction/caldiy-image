name: Build Cal.diy image

# Construit l'image Docker de calcom/cal.diy (aucune image officielle publiee)
# et la pousse sur ghcr.io/<owner>/caldiy.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche, tag ou commit de calcom/cal.diy a construire"
        required: true
        default: "main"
      webapp_url:
        description: "URL publique integree dans les fichiers statiques"
        required: true
        default: "https://cal.srv.rushorder.be"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/caldiy
  PG_USER: unicorn_user
  PG_PASSWORD: magical_password
  PG_DB: calendso

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout calcom/cal.diy
        uses: actions/checkout@v4
        with:
          repository: calcom/cal.diy
          ref: ${{ inputs.ref }}

      - name: Resolve version
        id: v
        run: |
          echo "sha=$(git rev-parse --short=10 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cd --date=format:%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Start build-time database
        run: |
          docker run -d --name database \
            -e POSTGRES_USER=$PG_USER -e POSTGRES_PASSWORD=$PG_PASSWORD -e POSTGRES_DB=$PG_DB \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec database pg_isready -U $PG_USER -d $PG_DB && break
            sleep 2
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            network=container:database

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.v.outputs.date }}-${{ steps.v.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.v.outputs.sha }}
            org.opencontainers.image.description=Cal.diy (calcom/cal.diy) built from source
            org.opencontainers.image.licenses=MIT
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=${{ inputs.webapp_url }}
            NEXT_PUBLIC_LICENSE_CONSENT=agree
            CALCOM_TELEMETRY_DISABLED=1
            DATABASE_URL=postgresql://${{ env.PG_USER }}:${{ env.PG_PASSWORD }}@localhost:5432/${{ env.PG_DB }}
            DATABASE_DIRECT_URL=postgresql://${{ env.PG_USER }}:${{ env.PG_PASSWORD }}@localhost:5432/${{ env.PG_DB }}

      - name: Summary
        run: |
          echo "Image: $IMAGE:${{ steps.v.outputs.date }}-${{ steps.v.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
